<!doctype html>
<meta charset="utf-8">
<title>Dictionary IndexedDB smoke test</title>
<pre id="result">RUNNING</pre>
<script>globalThis.module = { exports: {} };</script>
<script src="../shared/constants.js"></script>
<script src="../shared/dictionary-store.js"></script>
<script>
// Run on localhost, in an isolated browser profile. No R2 or model requests.
(async () => {
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const { createStore, createPersistence } = module.exports;
    const persistence = createPersistence();
    const pack = { schemaVersion: 1, version: "browser-test", sourceLanguage: "en", targetLanguage: "pl",
        entries: { book: [{ senseId: "book.1", translations: ["książka"] }] }, forms: {} };
    const bytes = new TextEncoder().encode(JSON.stringify(pack));
    const sha256 = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)), b => b.toString(16).padStart(2, "0")).join("");
    const catalog = { schemaVersion: 1, pairs: { "en-pl": {
        path: "releases/browser-test/en-pl.json", version: pack.version, bytes: bytes.length, sha256, entryCount: 1,
    } } };
    let calls = 0;
    const online = createStore({ persistence, now: () => 1000000000, fetcher: async url => {
        calls++;
        return new Response(url.endsWith("catalog.json") ? JSON.stringify(catalog) : bytes);
    } });
    assert((await online.getPair("en", "pl")).entries.book[0].translations[0] === "książka", "download failed");
    assert(calls === 2, "expected catalog + pair downloads on a fresh profile");
    const offline = createStore({ persistence: createPersistence(), now: () => 1000000001,
        fetcher: async () => { throw new Error("offline"); } });
    assert((await offline.getPair("en", "pl")).version === "browser-test", "new store failed to read IndexedDB");
    // Simulate declared byte weights without allocating 128 MiB of fixtures.
    const weight = 64 * 1024 * 1024;
    await persistence.put({ key: "old", bytes: weight, lastUsed: 1 });
    await persistence.put({ key: "newer", bytes: weight, lastUsed: 2 });
    assert(await persistence.get("old") === null, "oldest pack not evicted");
    assert(await persistence.get("newer") !== null, "new pack evicted incorrectly");
    assert(await persistence.get("catalog") !== null, "catalog must survive eviction");
    assert(await persistence.get("en-pl") !== null, "recent pair must survive eviction");
    document.getElementById("result").textContent = "PASS: real IndexedDB writes, reload, offline lookup and eviction";
})().catch(error => {
    document.getElementById("result").textContent = "FAIL: " + error.message;
});
</script>
