<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title data-i18n="ui_lectoroai_vocabulary_quiz">LectoroAI — Vocabulary Quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>

<body>
    <header class="quiz-topbar">
        <div class="quiz-brand">
            <img src="icons/icon48.png" alt="Lectoro" class="brand-logo">
            <div class="brand-info">
                <h1 class="brand-title" data-i18n="ui_lectoro_ai_quiz">Lectoro AI — Quiz</h1>
            </div>
        </div>
        <div class="quiz-controls">
            <button type="button" class="btn-ctrl btn-download" id="downloadHtmlBtn"
                title="Download HTML file (works offline)" data-i18n-title="ui_download_html_file_works_offline">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="ctrl-icon">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span data-i18n="ui_download">Download</span>
            </button>
            <button type="button" class="btn-ctrl btn-reload" id="reloadQuizBtn"
                title="Restart quiz from the beginning" data-i18n-title="ui_restart_quiz_from_the_beginning">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="ctrl-icon">
                    <polyline points="1 4 1 10 7 10" />
                    <polyline points="23 20 23 14 17 14" />
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
                </svg>
                <span data-i18n="ui_restart">Restart</span>
            </button>
        </div>
    </header>

    <main class="quiz-container">
        <iframe id="quizFrame" class="quiz-iframe" src="quiz-runner.html" title="Interactive Quiz" data-i18n-title="ui_interactive_quiz"></iframe>
    </main>

    <script src="shared/constants.js"></script>
    <script src="shared/i18n.js"></script>
    <script src="quiz.js"></script>
</body>

</html>
