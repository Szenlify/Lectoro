<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
    #source {
        width: 260px;
        font: 24px/30px Arial, sans-serif;
        text-align: center;
    }
</style>
<div id="source">This original Netflix subtitle should wrap into exactly the same rendered rows</div>
<script src="netflix.js"></script>
<script>
    const splitIntoWordSpans = (element, className) => {
        const parts = element.textContent.match(/\S+|\s+/g) || [];
        element.textContent = "";
        for (const part of parts) {
            if (/\S/.test(part)) {
                const span = document.createElement("span");
                span.className = className;
                span.textContent = part;
                element.appendChild(span);
            } else {
                element.appendChild(document.createTextNode(part));
            }
        }
    };
    requestAnimationFrame(() => {
        const source = document.querySelector("#source");
        const original = LectoroNetflix.captureRenderedLines([source]);
        const layer = LectoroNetflix.createWordCloudSourceLayer({
            source,
            parent: document.body,
            prefix: "__qt_",
            splitIntoWordSpans,
        });
        const copied = layer.querySelectorAll(".__qt_word-cloud-source-line");
        document.body.dataset.result =
            original.length === copied.length && original.length > 1
                ? `OK:${original.length}`
                : `FAIL:${original.length}:${copied.length}`;
    });
</script>
